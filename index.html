<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Studio Luzi Santana</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Karla:wght@400;500;600;700&display=swap">

<style>
  /* Layout: coluna de 420px sobre ameixa profunda — logo com halo rosé, brilhos flutuantes, cards com fio rosé que escorre no hover */
  :root{
    --plum-ink:#180e12;
    --plum:#24141a;
    --plum-2:#301a22;
    --plum-3:#3b2129;
    --rose:#e9b9c4;        /* rosé extraído da logo */
    --rose-deep:#c4808f;
    --rose-glow:#f9dfe5;
    --cream:#f8eef1;
    --muted:#ab8992;
    --radius:17px;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{background:var(--plum-ink)}

  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  .wrap{
    position:relative;min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding-left:max(18px,env(safe-area-inset-left,0px));
    padding-right:max(18px,env(safe-area-inset-right,0px));
    padding-block:0 46px;
    color:var(--cream);
    font-family:"Karla","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(760px 420px at 50% -4%, rgba(233,185,196,.19), transparent 64%),
      radial-gradient(520px 320px at 50% 14%, rgba(196,128,143,.14), transparent 70%),
      linear-gradient(180deg, var(--plum) 0%, var(--plum-ink) 58%);
  }

  /* brilhos ambiente, como o glitter da logo */
  .sparkles{position:absolute;top:0;left:0;right:0;height:660px;overflow:hidden;pointer-events:none;z-index:0}
  .sp{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:var(--rose-glow);opacity:.3;
    box-shadow:0 0 7px rgba(233,185,196,.9);
  }
  .sp.b{width:4.5px;height:4.5px}
  .sp.s{width:2px;height:2px}
  @media (prefers-reduced-motion: no-preference){
    .sp{animation:tw 5s ease-in-out infinite}
  }
  @keyframes tw{0%,100%{opacity:.14;transform:scale(.75)}50%{opacity:.62;transform:scale(1.3)}}

  .stage{position:relative;z-index:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}

  /* fio superior rosé */
  .thread{
    width:100%;height:3px;flex:none;border-radius:0 0 3px 3px;
    background:linear-gradient(90deg,transparent,var(--rose-deep) 18%,var(--rose-glow) 50%,var(--rose-deep) 82%,transparent);
    box-shadow:0 1px 20px rgba(233,185,196,.42);
  }

  /* ---------- cabeçalho ---------- */
  .head{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:26px;width:100%}
  .mark{
    position:relative;width:100%;max-width:290px;height:auto;display:block;
    filter:drop-shadow(0 14px 34px rgba(0,0,0,.55));
  }
  .orn{display:flex;align-items:center;gap:13px;color:var(--rose-deep)}
  .orn::before,.orn::after{content:"";height:1px;width:54px;background:linear-gradient(90deg,transparent,var(--rose-deep))}
  .orn::after{background:linear-gradient(90deg,var(--rose-deep),transparent)}
  .orn svg{width:13px;height:13px;display:block;color:var(--rose)}
  .tag{
    margin:0;font-family:"Italiana",Georgia,serif;
    font-size:16px;letter-spacing:6px;text-transform:uppercase;color:var(--rose);
    text-align:center;text-wrap:balance;
  }

  /* ---------- cards ---------- */
  .links{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:13px}

  .card{
    position:relative;isolation:isolate;
    display:flex;align-items:center;gap:15px;
    width:100%;padding:16px 18px;border-radius:var(--radius);
    text-decoration:none;color:var(--cream);
    border:1px solid transparent;
    /* fio rosé escorrendo na borda */
    background:
      linear-gradient(168deg,var(--plum-3),var(--plum-2)) padding-box,
      linear-gradient(100deg,var(--rose-deep),var(--rose) 28%,var(--rose-glow) 50%,var(--rose) 72%,var(--rose-deep)) border-box;
    background-size:auto, 300% 100%;
    background-position:0 0, 0% 50%;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    overflow:hidden;
    transition:transform .32s cubic-bezier(.2,.75,.3,1), box-shadow .32s, background-position 1.1s ease;
  }
  /* florescer rosé a partir do ícone */
  .card::before{
    content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(240px circle at 12% 50%, rgba(233,185,196,.18), transparent 64%);
    opacity:0;transition:opacity .4s;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-3px);
    background-position:0 0, 100% 50%;
    box-shadow:0 18px 34px rgba(0,0,0,.55), 0 0 28px rgba(233,185,196,.22);
    outline:none;
  }
  .card:hover::before,.card:focus-visible::before{opacity:1}
  .card:active{transform:translateY(-1px) scale(.994)}

  .ic{
    flex:none;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 38% 32%, rgba(249,223,229,.2), rgba(196,128,143,.1));
    border:1px solid rgba(233,185,196,.34);
    color:var(--rose);
    transition:transform .4s cubic-bezier(.2,.75,.3,1), background .35s, border-color .35s, color .35s;
  }
  .card:hover .ic,.card:focus-visible .ic{
    transform:scale(1.09);
    background:linear-gradient(140deg,var(--rose-glow),var(--rose) 60%,var(--rose-deep));
    border-color:var(--rose-glow);color:#2a151c;
  }
  .ic svg{width:22px;height:22px;display:block}

  .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .t{font-size:14.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;line-height:1.2}
  .s{font-size:11.5px;color:var(--muted);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{margin-left:auto;flex:none;color:var(--rose);opacity:.6;transition:transform .32s,opacity .32s}
  .card:hover .chev,.card:focus-visible .chev{transform:translateX(5px);opacity:1}

  /* card principal — WhatsApp */
  .card.primary{
    background:
      linear-gradient(104deg,var(--rose-deep),var(--rose) 36%,var(--rose-glow) 66%,var(--rose)) padding-box,
      linear-gradient(104deg,var(--rose-glow),var(--rose-deep)) border-box;
    background-size:auto, auto;
    color:#2a151c;
    box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 30px rgba(233,185,196,.3);
  }
  .card.primary .s{color:rgba(42,21,28,.66)}
  .card.primary .chev{color:#2a151c;opacity:.75}
  .card.primary .ic{background:rgba(42,21,28,.11);border-color:rgba(42,21,28,.24);color:#2a151c}
  .card.primary:hover .ic{background:rgba(42,21,28,.2);border-color:rgba(42,21,28,.4);color:#2a151c;transform:scale(1.09)}
  .card.primary::before{background:none}
  .card.primary::after{
    content:"";position:absolute;top:0;left:-55%;width:36%;height:100%;z-index:-1;pointer-events:none;
    background:linear-gradient(104deg,transparent,rgba(255,255,255,.52),transparent);
    transform:skewX(-18deg);transition:left .85s cubic-bezier(.3,.7,.3,1);
  }
  .card.primary:hover{box-shadow:0 20px 40px rgba(0,0,0,.58), 0 0 44px rgba(233,185,196,.45)}
  .card.primary:hover::after,.card.primary:focus-visible::after{left:125%}

  /* ---------- telefone ---------- */
  .phone{
    width:100%;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);letter-spacing:.4px;
  }
  .phone b{color:var(--cream);font-weight:500;font-variant-numeric:tabular-nums}
  .copy{
    font:inherit;font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--rose);background:transparent;border:1px solid rgba(233,185,196,.34);
    padding:5px 12px;border-radius:999px;cursor:pointer;transition:.25s;
  }
  .copy:hover,.copy:focus-visible{background:rgba(233,185,196,.14);border-color:var(--rose);outline:none}

  /* ---------- rodapé ---------- */
  .foot{
    margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  }
  .foot p{
    margin:0;font-family:"Italiana",Georgia,serif;
    font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#7e5f69;
  }

  /* ---------- entrada ---------- */
  @media (prefers-reduced-motion: no-preference){
    .reveal{animation:rise .65s cubic-bezier(.2,.75,.3,1) backwards}
    @keyframes rise{from{opacity:0;transform:translateY(15px)}}
  }
</style>
